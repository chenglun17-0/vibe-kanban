[env]
# bindgen (libsqlite3-sys) needs an arm64 libclang; the one under
# /usr/local/Cellar/llvm@14 is x86_64 and fails on Apple Silicon.
LIBCLANG_PATH = { value = "/opt/homebrew/opt/llvm/lib", force = false }

[target.x86_64-apple-darwin]
rustflags = [
  "-C",
  "link-arg=-framework",
  "-C",
  "link-arg=AppKit",
  "-C",
  "link-arg=-framework",
  "-C",
  "link-arg=ApplicationServices",
  "-C",
  "link-arg=-framework",
  "-C",
  "link-arg=Foundation",
]

[target.aarch64-apple-darwin]
rustflags = [
  "-C",
  "link-arg=-framework",
  "-C",
  "link-arg=AppKit",
  "-C",
  "link-arg=-framework",
  "-C",
  "link-arg=ApplicationServices",
  "-C",
  "link-arg=-framework",
  "-C",
  "link-arg=Foundation",
]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/DEBUG:FASTLINK"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/DEBUG:FASTLINK"]
